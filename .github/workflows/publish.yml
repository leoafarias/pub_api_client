name: Publish
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    container:
      image: dart:latest

    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          release_version="${RELEASE_TAG#v}"
          if [ "$package_version" != "$release_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version."
            exit 1
          fi
      - name: Install dependencies
        run: dart pub get
      - name: Build Runner
        run: dart run build_runner build
      - name: Analyze
        run: dart analyze
      - name: Run tests
        run: dart test
      - name: Validate package
        run: dart pub publish --dry-run
      - name: Configure pub credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          if [ -z "$PUB_CREDENTIALS" ]; then
            echo "The PUB_CREDENTIALS secret is not configured."
            exit 1
          fi
          credentials_file="$HOME/.config/dart/pub-credentials.json"
          mkdir -p "$HOME/.config/dart"
          chmod 700 "$HOME/.config/dart"
          printf '%s' "$PUB_CREDENTIALS" > "$credentials_file"
          chmod 600 "$credentials_file"
      - name: Publish package
        run: dart pub publish --force
